<script src="./static/js/pages/signout.js"></script>
<script>
/* ─── Sidebar: Role-based navigation & active link ─────────────────── */
(function () {
    "use strict";

    function getToken() { return localStorage.getItem('access_token'); }

    function decodeJwt(token) {
        try {
            if (!token) return null;
            const parts = token.split('.');
            if (parts.length !== 3) return null;
            return JSON.parse(atob(parts[1]));
        } catch (_) { return null; }
    }

    function redirectToSignin() {
        const path = window.location.pathname;
        if (!path.includes('/signin') && !path.includes('/login') && !path.includes('/signup')) {
            window.location.href = '/signin';
        }
    }

    function initSidebar() {
        const token = getToken();
        if (!token) { redirectToSignin(); return; }

        const payload = decodeJwt(token);
        if (!payload) { redirectToSignin(); return; }

        /* ── Populate user info ── */
        const displayName = payload.name || payload.username || payload.email || 'User';
        const initial = displayName.charAt(0).toUpperCase();
        const roles = Array.isArray(payload.roles) ? payload.roles : [];
        const isAdmin = roles.some(r => r === 'admin' || r === 'dev');

        const nameEl = document.querySelector('.sidebar-name');
        const initialEl = document.querySelector('.sidebar-initial');
        const roleEl = document.querySelector('.sidebar-role');

        if (nameEl) nameEl.textContent = displayName;
        if (initialEl) initialEl.textContent = initial;
        if (roleEl) {
            roleEl.textContent = isAdmin ? 'Admin' : 'Member';
            roleEl.className = `sidebar-role badge rounded-pill fs-xs ${isAdmin
                ? 'text-bg-danger'
                : 'text-bg-info'}`;
        }

        /* ── Show admin section ── */
        if (isAdmin) {
            document.querySelectorAll('.sidebar-admin-section')
                .forEach(el => el.classList.remove('d-none'));
        }

        /* ── Active link ── */
        const currentSlug = window.location.pathname
            .split('/').filter(Boolean).pop() || 'account';

        document.querySelectorAll('.sidebar-nav-link').forEach(link => {
            const match = link.dataset.match || '';
            if (match && currentSlug.startsWith(match)) {
                link.classList.add('active');
                link.setAttribute('aria-current', 'page');
            }
        });

        /* ── Expose admin status globally for page scripts ── */
        window.__sidebarIsAdmin = isAdmin;
        window.__sidebarRoles   = roles;
    }

    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', initSidebar);
    } else {
        initSidebar();
    }
})();
</script>
