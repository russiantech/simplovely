{# Pickup / service request wizard (3 steps). Dependency-free; posts to POST /service-requests. #}
<div class="modal fade" id="modalServiceRequests" tabindex="-1" aria-labelledby="serviceRequestModalLabel" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content rounded-4">
      <div class="modal-header border-0 pb-0">
        <h5 class="modal-title" id="serviceRequestModalLabel">Request a pickup</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        <div id="sr-steps" class="d-flex justify-content-center gap-2 mb-3"></div>
        <form id="sr-form" novalidate>
          <section data-step="0">
            <div class="mb-3"><label class="form-label fw-medium" for="sr-name">Full name <span class="text-danger">*</span></label><input id="sr-name" class="form-control" autocomplete="name"><div class="invalid-feedback"></div></div>
            <div class="mb-3"><label class="form-label fw-medium" for="sr-email">Email <span class="text-danger">*</span></label><input id="sr-email" type="email" class="form-control" autocomplete="email"><div class="invalid-feedback"></div></div>
            <div class="mb-1"><label class="form-label fw-medium" for="sr-phone">Phone <span class="text-danger">*</span></label><input id="sr-phone" type="tel" class="form-control" autocomplete="tel" placeholder="08012345678"><div class="invalid-feedback"></div></div>
          </section>
          <section data-step="1" class="d-none">
            <div class="mb-3"><label class="form-label fw-medium" for="sr-service">Service <span class="text-danger">*</span></label><select id="sr-service" class="form-select"><option value="">Loading&hellip;</option></select><div class="invalid-feedback"></div></div>
            <div class="row g-3 mb-3">
              <div class="col-5"><label class="form-label fw-medium" for="sr-qty">Quantity <span class="text-danger">*</span></label><input id="sr-qty" type="number" min="1" max="1000" step="1" class="form-control"><div class="invalid-feedback"></div></div>
              <div class="col-7"><label class="form-label fw-medium" for="sr-area">Your area <span class="text-danger">*</span></label><select id="sr-area" class="form-select"><option value="">Loading&hellip;</option></select><div class="invalid-feedback"></div></div>
            </div>
            <div class="mb-3"><label class="form-label fw-medium" for="sr-address">Pickup address <span class="text-danger">*</span></label><input id="sr-address" class="form-control" autocomplete="street-address"><div class="invalid-feedback"></div></div>
            <div class="form-check"><input id="sr-privacy" type="checkbox" class="form-check-input"><label for="sr-privacy" class="form-check-label fs-sm">I agree to the <a href="{{ policy_link }}" target="_blank" rel="noopener">Privacy Policy</a>.</label><div class="invalid-feedback"></div></div>
          </section>
          <section data-step="2" class="d-none"><dl class="row mb-0" id="sr-review"></dl></section>
          <div id="sr-error" class="alert alert-danger fs-sm mt-3 mb-0 d-none"></div>
        </form>
        <div id="sr-success" class="text-center py-4 d-none">
          <div class="display-4 mb-2">&#127881;</div><h4 class="fw-bold mb-2">Request received!</h4>
          <p class="text-body-secondary mb-4">Our team will contact you shortly to confirm pickup details.</p>
          <button class="btn btn-info rounded-pill px-4" data-bs-dismiss="modal">Close</button>
        </div>
      </div>
      <div class="modal-footer border-0 pt-0 justify-content-between" id="sr-footer">
        <button type="button" class="btn btn-outline-secondary rounded-pill px-4" id="sr-back">Cancel</button>
        <button type="button" class="btn btn-info rounded-pill px-4" id="sr-next">Continue</button>
      </div>
    </div>
  </div>
</div>
<script>
(function () {
  'use strict';
  const STEPS = ['Your info', 'Details', 'Review'];
  const el = document.getElementById('modalServiceRequests');
  if (!el) return;
  const $ = (id) => document.getElementById(id);
  const esc = (v) => String(v ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  let step = 0, loaded = false, areas = [], services = [];

  function renderSteps() {
    $('sr-steps').innerHTML = STEPS.map((_, i) => `<div class="rounded-pill" style="height:6px;width:${i <= step ? 36 : 18}px;background:${i <= step ? 'var(--bs-info)' : 'var(--bs-border-color)'};transition:all .3s"></div>`).join('');
    el.querySelectorAll('section[data-step]').forEach((s) => s.classList.toggle('d-none', Number(s.dataset.step) !== step));
    $('sr-back').textContent = step === 0 ? 'Cancel' : 'Back';
    $('sr-next').textContent = step === STEPS.length - 1 ? 'Submit request' : 'Continue';
    if (step === 2) renderReview();
  }

  function fieldError(id, msg) {
    const input = $(id); input.classList.toggle('is-invalid', Boolean(msg));
    const fb = input.parentElement.querySelector('.invalid-feedback'); if (fb) fb.textContent = msg || '';
  }

  function validate() {
    const v = (id) => $(id).value.trim();
    const checks = step === 0 ? [
      ['sr-name', !v('sr-name') && 'Name is required.'],
      ['sr-email', !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v('sr-email')) && 'A valid email is required.'],
      ['sr-phone', !/^\+?[0-9\s\-()]{7,18}$/.test(v('sr-phone')) && 'A valid phone number is required.'],
    ] : step === 1 ? [
      ['sr-service', !v('sr-service') && 'Please choose a service.'],
      ['sr-qty', !(Number(v('sr-qty')) >= 1 && Number.isInteger(Number(v('sr-qty')))) && 'Enter a whole number, 1 or more.'],
      ['sr-area', !v('sr-area') && 'Please select your area.'],
      ['sr-address', !v('sr-address') && 'Pickup address is required.'],
      ['sr-privacy', !$('sr-privacy').checked && 'Please accept the Privacy Policy.'],
    ] : [];
    checks.forEach(([id, msg]) => fieldError(id, msg));
    return checks.every(([, msg]) => !msg);
  }

  function renderReview() {
    const area = areas.find((a) => String(a.id) === $('sr-area').value);
    const svc = services.find((s) => String(s.id) === $('sr-service').value);
    const rows = [['Name', $('sr-name').value], ['Email', $('sr-email').value], ['Phone', $('sr-phone').value], ['Service', svc && svc.name],
      ['Quantity', $('sr-qty').value], ['Area', area && `${area.area_name}${area.price ? ` (delivery ₦${Number(area.price).toLocaleString('en-NG')})` : ''}`], ['Address', $('sr-address').value]];
    $('sr-review').innerHTML = rows.map(([k, val]) => `<dt class="col-4 text-body-secondary fw-normal">${k}</dt><dd class="col-8 fw-medium">${esc(val)}</dd>`).join('');
  }

  async function loadReferenceData() {
    try {
      const [a, s] = await Promise.all([window.make_request(`${window.apiUrl}/areas`), window.make_request(`${window.apiUrl}/services`)]);
      areas = a.areas || []; services = s.services || [];
      $('sr-area').innerHTML = '<option value="">Select your area&hellip;</option>' + areas.map((x) => `<option value="${x.id}">${esc(x.area_name)}</option>`).join('');
      $('sr-service').innerHTML = '<option value="">Select a service&hellip;</option>' + services.map((x) => `<option value="${x.id}">${esc(x.name)}</option>`).join('');
      loaded = true;
    } catch (err) {
      $('sr-error').textContent = window.Utils.friendlyError(err); $('sr-error').classList.remove('d-none');
    }
  }

  function prefillFromSession() {
    const p = window.decodeJwtPayload && window.decodeJwtPayload(localStorage.getItem('access_token'));
    if (p && !$('sr-name').value) { $('sr-name').value = p.name || p.username || ''; $('sr-email').value = p.email || ''; }
  }

  async function submit() {
    const btn = $('sr-next'); btn.disabled = true; btn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span>Submitting…';
    $('sr-error').classList.add('d-none');
    try {
      await window.make_request(`${window.apiUrl}/service-requests`, { method: 'POST', body: JSON.stringify({
        name: $('sr-name').value.trim(), email: $('sr-email').value.trim(), phone: $('sr-phone').value.trim(),
        quantity: Number($('sr-qty').value), address: $('sr-address').value.trim(),
        area_id: Number($('sr-area').value), service_id: Number($('sr-service').value) }) });
      $('sr-form').classList.add('d-none'); $('sr-steps').classList.add('d-none'); $('sr-footer').classList.add('d-none'); $('sr-success').classList.remove('d-none');
    } catch (err) {
      $('sr-error').textContent = window.Utils.friendlyError(err); $('sr-error').classList.remove('d-none');
      btn.disabled = false; btn.textContent = 'Submit request';
    }
  }

  $('sr-next').addEventListener('click', () => {
    if (!validate()) return;
    if (step < STEPS.length - 1) { step += 1; renderSteps(); } else submit();
  });
  $('sr-back').addEventListener('click', () => {
    if (step === 0) bootstrap.Modal.getOrCreateInstance(el).hide(); else { step -= 1; renderSteps(); }
  });
  el.addEventListener('show.bs.modal', () => {
    step = 0; $('sr-form').classList.remove('d-none'); $('sr-steps').classList.remove('d-none'); $('sr-footer').classList.remove('d-none'); $('sr-success').classList.add('d-none');
    $('sr-error').classList.add('d-none'); $('sr-next').disabled = false;
    prefillFromSession(); renderSteps(); if (!loaded) loadReferenceData();
  });
})();
</script>
