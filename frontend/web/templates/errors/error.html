{% extends "incs/base.html" %}
{% block title %}{{ code }} - Simply Lovely{% endblock %}
{% block content %}
<main class="content-wrapper">
  <div class="container py-5 text-center" style="max-width:640px">
    <div class="display-1 fw-bold text-primary mb-2">{{ code }}</div>
    <h1 class="h3 mb-3">{{ title }}</h1>
    <p class="text-muted mb-4">{{ message }}</p>
    <div class="d-flex justify-content-center gap-2 flex-wrap">
      <a href="./" class="btn btn-dark rounded-pill">Back to home</a>
      <a href="./contact" class="btn btn-outline-dark rounded-pill">Contact us</a>
    </div>
  </div>
</main>
{% endblock %}
